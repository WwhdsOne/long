services:
  long:
    build:
      context: .
      dockerfile: Dockerfile
    image: long:latest
    container_name: long
    restart: unless-stopped
    networks:
      - docker-compose_app-net
    ports:
      - "16002:16002"
    environment:
      CONSUL_ADDR: ${CONSUL_ADDR}
      CONSUL_CONFIG_KEY: ${CONSUL_CONFIG_KEY}
      LONG_LISTEN_HOST: 0.0.0.0
      LONG_LISTEN_PORT: 16002

networks:
  docker-compose_app-net:
    external: true
